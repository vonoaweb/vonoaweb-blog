name: Auto-generate Blog Post

on:
  schedule:
    # Lunes, miércoles y viernes. Varios horarios de RESPALDO porque el
    # scheduler de GitHub a veces retrasa o salta los cron. El script tiene
    # guard de idempotencia: solo publica el PRIMERO que corra cada día,
    # los demás no hacen nada. Minutos != :00 para evitar el pico de carga.
    - cron: '7 12 * * 1,3,5'   # ~6:07 am CST
    - cron: '19 15 * * 1,3,5'  # ~9:19 am CST (respaldo)
    - cron: '37 18 * * 1,3,5'  # ~12:37 pm CST (respaldo)
  workflow_dispatch:  # También se puede disparar manualmente

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./scripts
        run: npm install

      - name: Generate post
        working-directory: ./scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node generate-post.js

      - name: Commit and push
        id: commit
        run: |
          git config user.name "VonoaWeb Bot"
          git config user.email "bot@vonoaweb.com"
          git add content/posts/
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Nuevo artículo de blog [auto]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
