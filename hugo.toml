baseURL = "https://blog.vonoaweb.com/"
defaultContentLanguage = "es"
title = "Blog VonoaWeb"
summaryLength = 40
enableRobotsTXT = true

[params]
  description = "Artículos sobre diseño web, IA y automatización para PYMES en Guadalajara"
  author = "VonoaWeb"
  whatsapp = "525644645574"
  siteUrl = "https://vonoaweb.com"
  # Google Tag Manager — mismo que vonoaweb.com
  gtmId = "GTM-WGD4B5F5"
  # Google Analytics 4
  ga4Id = "G-3KN5E8EFG2"
  # Google Ads
  gadsId = "AW-10804436682"
  # Meta Pixel
  metaPixelId = "823900389572284"
  # Microsoft Clarity
  clarityId = "saa39f5odh"
  # Google Search Console (pegar código de verificación aquí)
  # googleSiteVerification = "TU_CODIGO_AQUI"

[pagination]
  pagerSize = 9

[params.og]
  image = "/images/brand/og-default.webp"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = false

[outputs]
  home = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.8

[taxonomies]
  tag = "tags"
  category = "categories"

[languages]
  [languages.es]
    locale = "es_MX"
    weight = 1

# Articulos relacionados (single.html): por etiquetas en comun, incluyendo
# articulos mas nuevos (Hugo, por defecto, solo sugiere los mas antiguos).
[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10
